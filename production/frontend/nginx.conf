
user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    # 菜品图片上传上限 10MB(application.yml: max-file-size),nginx 默认只有 1MB,不改会 413
    client_max_body_size 12m;

    server {
        listen 80;
        server_name _;

        root  /etc/nginx/html;
        index index.html;

        # 后端接口:浏览器请求 /api/xxx -> http://nan_po_xiao_chao:8081/xxx
        location /api/ {
            # 后端容器重建会换 IP;静态 proxy_pass 只在启动时解析一次,之后全是 502。
            # 这里用 Docker 内置 DNS(127.0.0.11)+ 变量形式,让 nginx 每次请求重新解析。
            resolver 127.0.0.11 valid=10s;
            set $backend http://nan_po_xiao_chao:8081;

            # 去掉 /api 前缀(和 Vite 开发代理的 rewrite 一致)
            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass         $backend$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # AI 流式回复是 SSE:不关缓冲的话会等整段生成完才一次性吐字
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 120s;
        }

        # vue-router 用的是 createWebHistory(),刷新 /orders 这类路径要回落到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
